<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Transposable Piano</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Piano" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="controls">
        <div class="transpose-controls">
          <button id="transpose-down" class="arrow" aria-label="Transpose down">
            ◀
          </button>
          <div class="transpose-display">
            <span>Transpose:</span>
            <strong id="transpose-value">0</strong>
            <span>semitones</span>
          </div>
          <button id="transpose-up" class="arrow" aria-label="Transpose up">
            ▶
          </button>
        </div>
        <label class="solfege-toggle">
          <input type="checkbox" id="solfege-toggle" />
          <span>Solfège</span>
        </label>
        <div class="key-signature" aria-label="Key signature">
          <span class="key-label">Key Signature</span>
          <span class="clef" aria-hidden="true">𝄞</span>
          <span id="key-signature-value" class="key-value">C</span>
          <span id="key-signature-accidentals" class="key-accidentals">
            no sharps/flats
          </span>
        </div>
      </header>

      <section
        class="keyboard"
        id="keyboard"
        aria-label="Piano keyboard"
      ></section>

      <footer class="version">Version <span id="app-version"></span></footer>
    </main>

    <script src="version.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        // Reload once when a new service worker takes over, so an updated
        // version shows up without a second manual refresh. Skipped on the
        // very first install, when there was no previous worker.
        const hadController = !!navigator.serviceWorker.controller;
        let reloading = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (!hadController || reloading) return;
          reloading = true;
          window.location.reload();
        });

        window.addEventListener("load", () => {
          // updateViaCache "none": always fetch sw.js and version.js from the
          // server when checking for updates, never from the HTTP cache.
          navigator.serviceWorker
            .register("sw.js", { updateViaCache: "none" })
            .then((registration) => {
              // An installed app can sit in the background for days without
              // reloading, so check for an update each time it comes back.
              document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                  registration.update().catch(() => {});
                }
              });
            })
            .catch(() => {});
        });
      }
    </script>
  </body>
</html>
